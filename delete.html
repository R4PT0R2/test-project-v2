<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конец</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: Segoe UI, sans-serif;
    }
    p {
        font-size: 24px;
        opacity: 1;
        animation: fadeOut 3s forwards; /* Текст плавно исчезнет */
    }
    @keyframes fadeOut {
        to { opacity: 0; }
    }
</style>
</head>
<body>
    <p>Может быть, только начало.</p>
</body>
</html>
