<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Ирины</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background: black;
}

.bg{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index: 5;
}

/* Холст для рисования молний */
#lightningCanvas {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
z-index: 7;
pointer-events: none;
}

#particles-container {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
z-index: 6;
pointer-events: none;
}

.particle {
position: absolute;
background: rgba(255, 235, 180, 0.5);
border-radius: 50%;
box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
animation: floatUp linear infinite;
}

@keyframes floatUp {
0% { transform: translateY(100vh) translateX(0) scale(0.5); opacity: 0; }
10% { opacity: 1; }
90% { opacity: 1; }
100% { transform: translateY(-10vh) translateX(50px) scale(1.2); opacity: 0; }
}

.meteor {
position: absolute;
width: 2px;
height: 80px;
background: linear-gradient(to top, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.5) 40%, transparent 100%);
transform: rotate(35deg);
animation: meteorFall linear infinite;
filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
opacity: 0;
}

@keyframes meteorFall {
0% { transform: translate(0, 0) rotate(35deg); opacity: 0; }
5% { opacity: 1; }
30% { opacity: 0; }
100% { transform: translate(-400px, 500px) rotate(35deg); opacity: 0; }
}

.raindrop {
position: absolute;
width: 1px;
height: 40px;
background: linear-gradient(transparent, rgba(255, 255, 255, 0.4));
animation: rainFall linear infinite;
}

@keyframes rainFall {
0% { transform: translateY(-50px); opacity: 0; }
10% { opacity: 1; }
90% { opacity: 1; }
100% { transform: translateY(105vh); opacity: 0; }
}

.content{
position:relative;
z-index:10;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
padding:20px;
}

h1{
font-size:60px;
margin-bottom:20px;
transition: opacity 0.6s ease;
text-shadow: 0 0 15px rgba(255,255,255,0.3);
}

p{
font-size:22px;
margin-bottom:30px;
max-width:700px;
transition: opacity 0.6s ease;
}

h1.huge-text {
font-size: 90px;
font-weight: bold;
letter-spacing: 2px;
}

p.sub-text {
font-size: 18px;
margin-top: 10px;
color: rgba(255, 255, 255, 0.7);
opacity: 0;
transition: opacity 0.6s ease;
}

.fade-out {
opacity: 0;
}

/* КРАСИВАЯ НЕОНОВАЯ КНОПКА СТАРТА */
.neon-btn {
padding: 18px 45px;
font-size: 20px;
font-weight: bold;
letter-spacing: 2px;
color: #fff;
background: transparent;
border: 2px solid #00e5ff;
border-radius: 50px;
cursor: pointer;
outline: none;
box-shadow: 0 0 10px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(0, 229, 255, 0.4);
text-shadow: 0 0 5px #fff;
transition: all 0.4s ease;
}

.neon-btn:hover {
color: #000;
background: #00e5ff;
box-shadow: 0 0 30px #00e5ff, 0 0 60px #00e5ff;
transform: scale(1.05);
}

.final-actions {
display: flex;
gap: 20px;
margin-top: 30px;
opacity: 0;
pointer-events: none;
transition: opacity 1s ease;
}

.btn-delete {
background: #ff4d4d;
color: white;
}

.btn-delete:hover {
background: #e63939;
box-shadow: 0 0 15px #ff4d4d;
}

.btn-save {
background: #00cc66;
color: white;
}

.btn-save:hover {
background: #00b359;
box-shadow: 0 0 15px #00cc66;
}
</style>
</head>

<body>

<img id="bgImage" src="background.png" class="bg" alt="фон">
<div id="bgOverlay" class="overlay"></div>
<div id="particles-container"></div>

<!-- Канвас для анимации электрических молний -->
<canvas id="lightningCanvas"></canvas>

<div class="content">
    <h1 id="mainTitle">Для Ирины</h1>
    <p id="mainText">Небольшое воспоминание от Эльмара</p>
    <p id="finalSubText" class="sub-text"></p> 

    <!-- Применена стильная кнопка .neon-btn -->
    <button id="startBtn" class="neon-btn" onclick="playVoice()">
    НАЧАТЬ
    </button>

    <div id="finalButtons" class="final-actions">
        <button class="btn-delete" onclick="actionDelete()">Удалить ✖</button>
        <button class="btn-save" onclick="actionSave()">Сохранить ❤️</button>
    </div>

    <audio id="voice" src="start.mp3"></audio>
    <audio id="kamin" src="kamin.mp3" loop></audio>
    <audio id="finalVoice" src="final.mp3"></audio>
    <audio id="sagaMusic" src="saga.mp3" loop></audio>
</div>

<!-- Видео переписки (Один целый файл с Яндекс Диска) -->
<video id="chatVideo" style="
   display:none;
   position:fixed;
   top:0;
   left:0;
   width:100%;
   height:100%;
   object-fit:contain;
   pointer-events:none;
   mix-blend-mode: screen; 
   z-index:15;">
   <!-- ИСПРАВЛЕНО: Сюда вставьте полученную прямую ссылку downloader.disk.yandex.ru -->
   <source src="https://clck.ru/3Vcr2J" type="video/mp4">
</video>

<script src="script.js"></script>

</body>
</html>
