<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Ирины</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background: black;
}

.bg{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
transition: opacity 2s ease;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index: 5;
transition: background 2s ease;
}

#lightningCanvas {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
z-index: 7;
pointer-events: none;
}

/* ИСПРАВЛЕНО: z-index поднят до 30, чтобы игра была строго поверх всех спецэффектов и частиц */
.game-screen {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
z-index: 30; 
display: none; 
flex-direction: column;
justify-content: center;
align-items: center;
background: rgba(10, 7, 5, 0.93);
color: white;
text-align: center;
padding: 20px;
opacity: 0;
transition: opacity 1s ease;
}

.game-title {
font-size: 24px;
font-weight: bold;
color: #00e5ff;
letter-spacing: 1px;
margin-bottom: 50px;
text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
animation: pulseText 2s infinite ease-in-out;
}

@keyframes pulseText {
0%, 100% { opacity: 0.7; }
50% { opacity: 1; }
}

.heart-lock {
width: 120px;
height: 120px;
background: transparent;
position: relative;
cursor: pointer;
filter: drop-shadow(0 0 15px #ff00ff);
animation: floatHeart 3s infinite ease-in-out;
transition: transform 0.3s ease;
-webkit-tap-highlight-color: transparent; /* Убирает серый квадрат при тапе на Айфонах */
}

.heart-lock:hover {
transform: scale(1.1);
filter: drop-shadow(0 0 25px #ff00ff);
}

.heart-lock::before, .heart-lock::after {
content: "";
position: absolute;
top: 0;
width: 60px;
height: 100px;
background: #ff00ff;
border-radius: 50px 50px 0 0;
}

.heart-lock::before { left: 60px; transform: rotate(-45deg); transform-origin: 0 100%; }
.heart-lock::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }

.keyhole {
position: absolute;
top: 40px;
left: 50%;
transform: translateX(-50%);
width: 16px;
height: 16px;
background: #000;
border-radius: 50%;
z-index: 32;
}

.keyhole::after {
content: "";
position: absolute;
top: 12px;
left: 50%;
transform: translateX(-50%);
width: 12px;
height: 24px;
background: #000;
border-radius: 0 0 4px 4px;
}

@keyframes floatHeart {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-10px); }
}

#particles-container {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
z-index: 6;
pointer-events: none;
}

.particle {
position: absolute;
background: rgba(255, 235, 180, 0.5);
border-radius: 50%;
box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
animation: floatUp linear infinite;
}

@keyframes floatUp {
0% { transform: translateY(100vh) translateX(0) scale(0.5); opacity: 0; }
10% { opacity: 1; }
90% { opacity: 1; }
100% { transform: translateY(-10vh) translateX(50px) scale(1.2); opacity: 0; }
}

.meteor {
position: absolute;
width: 2px;
height: 80px;
background: linear-gradient(to top, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.5) 40%, transparent 100%);
transform: rotate(35deg);
animation: meteorFall linear infinite;
filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
opacity: 0;
}

@keyframes meteorFall {
0% { transform: translate(0, 0) rotate(35deg); opacity: 0; }
5% { opacity: 1; }
30% { opacity: 0; }
100% { transform: translate(-400px, 500px) rotate(35deg); opacity: 0; }
}

.raindrop {
position: absolute;
width: 1px;
height: 40px;
background: linear-gradient(transparent, rgba(255, 255, 255, 0.4));
animation: rainFall linear infinite;
}

@keyframes rainFall {
0% { transform: translateY(-50px); opacity: 0; }
10% { opacity: 1; }
90% { opacity: 1; }
100% { transform: translateY(105vh); opacity: 0; }
}

.content{
position:relative;
z-index:10;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
padding:20px;
}

h1{
font-size:60px;
margin-bottom:20px;
transition: opacity 0.6s ease;
text-shadow: 0 0 15px rgba(255,255,255,0.3);
}

p{
font-size:22px;
margin-bottom:30px;
max-width:700px;
transition: opacity 0.6s ease;
}

h1.huge-text {
font-size: 90px;
font-weight: bold;
letter-spacing: 2px;
}

p.sub-text {
font-size: 18px;
margin-top: 10px;
color: rgba(255, 255, 255, 0.7);
opacity: 0;
transition: opacity 0.6s ease;
}

.fade-out {
opacity: 0;
}

.neon-btn {
padding: 18px 45px;
font-size: 20px;
font-weight: bold;
letter-spacing: 2px;
color: #fff;
background: transparent;
border: 2px solid #00e5ff;
border-radius: 50px;
cursor: pointer;
outline: none;
box-shadow: 0 0 10px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(0, 229, 255, 0.4);
text-shadow: 0 0 5px #fff;
transition: all 0.4s ease;
}

.neon-btn:hover {
color: #000;
background: #00e5ff;
box-shadow: 0 0 30px #00e5ff, 0 0 60px #00e5ff;
transform: scale(1.05);
}

.screenshot-container {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
display: flex;
justify-content: center;
align-items: center;
z-index: 15; /* Поверх канваса молний, но под экраном игры */
pointer-events: none;
}

.chat-screenshot {
max-width: 85%;
max-height: 75vh;
object-fit: contain;
border-radius: 20px;
box-shadow: 0 20px 50px rgba(0, 229, 255, 0.25);
border: 1px solid rgba(255, 255, 255, 0.2);
opacity: 0;
transform: scale(0.9) rotate(-1deg);
transition: opacity 0.8s ease, transform 10s linear;
}

.chat-screenshot.zoom-active {
opacity: 1;
transform: scale(1.06) rotate(1deg);
}

.final-actions {
display: flex;
gap: 20px;
margin-top: 30px;
opacity: 0;
pointer-events: none;
transition: opacity 1s ease;
}

.btn-delete { background: #ff4d4d; color: white; }
.btn-delete:hover { background: #e63939; box-shadow: 0 0 15px #ff4d4d; }
.btn-save { background: #00cc66; color: white; }
.btn-save:hover { background: #00b359; box-shadow: 0 0 15px #00cc66; }
</style>
</head>

<body>

<img id="bgImage" src="background.png" class="bg" alt="фон">
<div id="bgOverlay" class="overlay"></div>
<div id="particles-container"></div>

<canvas id="lightningCanvas"></canvas>

<!-- ИСПРАВЛЕНО: Добавлен ontouchstart для моментальной отзывчивости на клик пальцем -->
<div id="gameScreen" class="game-screen">
    <div class="game-title">Коснись сердца, чтобы открыть дверь в воспоминания</div>
    <div class="heart-lock" onclick="unlockMemories()" ontouchstart="unlockMemories()">
        <div class="keyhole"></div>
    </div>
</div>

<div class="screenshot-container">
    <img id="screenshotDisplay" class="chat-screenshot" src="" alt="Момент чата">
</div>

<div class="content">
    <h1 id="mainTitle">Для Ирины</h1>
    <p id="mainText">Небольшое воспоминание от Эльнара</p>
    <p id="finalSubText" class="sub-text"></p> 

    <button id="startBtn" class="neon-btn" onclick="playVoice()">
    НАЧАТЬ
    </button>

    <div id="finalButtons" class="final-actions">
        <button class="btn-delete" onclick="actionDelete()">Удалить ✖</button>
        <button class="btn-save" onclick="actionSave()">Сохранить ❤️</button>
    </div>
</div>

<audio id="voice" src="new-intro.mp3"></audio>
<audio id="kamin" src="kamin.mp3" loop></audio>
<audio id="finalVoice" src="final.mp3"></audio>
<audio id="sagaMusic" src="new-final.mp3" loop></audio>
<audio id="doorSound" src="door-open.mp3"></audio>

<script src="script.js"></script>

</body>
</html>
