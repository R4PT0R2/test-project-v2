<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакты</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        min-height: 100vh;
        background: black;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: Segoe UI, sans-serif;
        text-align: center;
        padding: 30px 20px;
        overflow-x: hidden;
    }

    /* Анимация плавного появления всего содержимого */
    .fade-container {
        opacity: 0;
        animation: fadeIn 2s forwards ease-in-out;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 35px;
        max-width: 600px;
        width: 100%;
    }

    /* Стильная галерея для двух совместных фотографий */
    .gallery {
        display: flex;
        gap: 20px;
        width: 100%;
        justify-content: center;
    }

    .gallery-img {
        width: calc(50% - 10px);
        aspect-ratio: 3 / 4; /* Красивое вертикальное соотношение сторон */
        object-fit: cover;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition: transform 0.4s ease;
    }

    .gallery-img:hover {
        transform: scale(1.03);
    }

    /* Оформление списка номеров Эльнара */
    .phones {
        font-size: 32px;
        font-weight: bold;
        line-height: 1.8;
        letter-spacing: 1px;
        color: #f0f0f0;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    /* Адаптивность под узкие экраны телефонов */
    @media (max-width: 480px) {
        .gallery {
            flex-direction: column; /* На смартфонах фото встанут друг под друга */
            gap: 15px;
        }
        .gallery-img {
            width: 100%;
            max-height: 350px;
        }
        .phones {
            font-size: 26px; /* Чуть уменьшаем шрифт номеров на мобильных */
        }
    }
</style>
</head>
<body>

    <div class="fade-container">
        <!-- Блок с вашими совместными фотографиями -->
        <div class="gallery">
            <img src="photo1.jpg" class="gallery-img" alt="Мы вместе 1">
            <img src="photo2.jpg" class="gallery-img" alt="Мы вместе 2">
        </div>

        <!-- Ваши контактные номера -->
        <div class="phones">
            <p>+7 (922) 438-53-03</p>
            <p>+7 (958) 155-71-54</p>
        </div>
    </div>

    <!-- Музыкальное сопровождение саги -->
    <audio id="saveSaga" src="saga.mp3" loop></audio>

<script>
    window.addEventListener("DOMContentLoaded", () => {
        const saga = document.getElementById("saveSaga");
        if (saga) {
            saga.volume = 0.3; // Комфортная фоновая громкость
            saga.play().catch(e => console.log("Автозапуск аудио заблокирован:", e));
        }
    });
</script>

</body>
</html>
